name: F-Droid Update MR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      submit:
        description: "Create or update the GitLab fdroiddata merge request"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_commit:
        description: "Optional release commit SHA; defaults to the selected ref"
        required: false
        type: string
      source_branch:
        description: "Optional GitLab source branch name"
        required: false
        type: string

permissions:
  contents: read

jobs:
  fdroid-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Refresh local F-Droid metadata
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $arguments = @{ UpdateMetadata = $true; SkipBuild = $true }
          if ($env:RELEASE_COMMIT) {
            $arguments.Commit = $env:RELEASE_COMMIT
          }
          ./scripts/Test-FdroidPreflight.ps1 @arguments

      - name: Submit or dry-run F-Droid update
        shell: pwsh
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          $submit = "${{ github.event_name }}" -eq "push" -or "${{ inputs.submit }}" -eq "true"
          $arguments = @{}
          if ($env:RELEASE_COMMIT) {
            $arguments.Commit = $env:RELEASE_COMMIT
          }
          if ($env:SOURCE_BRANCH) {
            $arguments.SourceBranch = $env:SOURCE_BRANCH
          }
          if ($submit) {
            $arguments.Submit = $true
          }
          ./scripts/Submit-FdroidUpdate.ps1 @arguments
