name: GitHub Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing tag to build. Leave empty to test the selected branch."
        required: false
        type: string
      publish:
        description: "Publish to a GitHub Release. Requires an existing tag."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag name
        id: meta
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "$PUBLISH" = "true" ]; then
            echo "Manual publishing requires an existing tag." >&2
            exit 1
          else
            VERSION="$(
              sed -nE \
                's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                app/build.gradle.kts \
                | head -n 1
            )"
            test -n "$VERSION"
            TAG="v$VERSION"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Android version
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1 -Tag "${{ steps.meta.outputs.tag }}"

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VENTOID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ventoid-release.jks"
          echo "VENTOID_RELEASE_STORE_FILE=$RUNNER_TEMP/ventoid-release.jks" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build signed release APK and AAB
        env:
          VENTOID_RELEASE_STORE_PASSWORD: ${{ secrets.VENTOID_RELEASE_STORE_PASSWORD }}
          VENTOID_RELEASE_KEY_ALIAS: ${{ secrets.VENTOID_RELEASE_KEY_ALIAS }}
          VENTOID_RELEASE_KEY_PASSWORD: ${{ secrets.VENTOID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Verify APK manifest matches tag and Gradle
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1 -Tag "${{ steps.meta.outputs.tag }}" -ApkPath app/build/outputs/apk/release/app-release.apk

      - name: Package release assets
        id: assets
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          # AGP may emit app-release.apk when signed, or app-release-unsigned.apk when not.
          if [ ! -f "$APK" ]; then
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              echo "Release APK is unsigned; signing secrets may be missing or incomplete." >&2
              exit 1
            fi
            echo "Release APK not found under app/build/outputs/apk/release/" >&2
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK" "$OUT/Ventoid_${VERSION}.apk"
          cp "$AAB" "$OUT/Ventoid_${VERSION}.aab"
          (
            cd "$OUT"
            sha256sum "Ventoid_${VERSION}.apk" "Ventoid_${VERSION}.aab" > SHA256SUMS.txt
          )
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload signed prerelease artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ventoid-${{ steps.meta.outputs.version }}-signed-prerelease
          path: |
            ${{ steps.assets.outputs.dir }}/Ventoid_${{ steps.meta.outputs.version }}.apk
            ${{ steps.assets.outputs.dir }}/Ventoid_${{ steps.meta.outputs.version }}.aab
            ${{ steps.assets.outputs.dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload assets to GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          OUT="${{ steps.assets.outputs.dir }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Ventoid ${{ steps.meta.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" \
            "$OUT/Ventoid_${{ steps.meta.outputs.version }}.apk" \
            "$OUT/Ventoid_${{ steps.meta.outputs.version }}.aab" \
            "$OUT/SHA256SUMS.txt" \
            --clobber
